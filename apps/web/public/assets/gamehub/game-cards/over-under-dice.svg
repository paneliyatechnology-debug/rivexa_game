<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<title>Over/Under Dice — editable game card</title>
<defs>
 <linearGradient id="cardBg" x1="0" y1="0" x2="480" y2="480"><stop stop-color="#073E4A"/><stop offset="1" stop-color="#080F24"/></linearGradient>
 <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19D9E8" stop-opacity=".23"/><stop offset="1" stop-color="#071329" stop-opacity=".05"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1A1"/><stop offset=".5" stop-color="#FFC83D"/><stop offset="1" stop-color="#E58B16"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="card-background"><rect x="4" y="4" width="472" height="472" rx="34" fill="url(#cardBg)" stroke="#19D9E8" stroke-width="2.5"/><rect x="5" y="5" width="470" height="470" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/><circle cx="420" cy="130" r="95" fill="#19D9E8" opacity=".07"/><circle cx="35" cy="330" r="70" fill="#19D9E8" opacity=".05"/></g>
<g id="art-panel"><rect x="20" y="20" width="440" height="230" rx="25" fill="url(#artBg)" stroke="#19D9E8" stroke-opacity=".55" stroke-width="1.5"/><path d="M36 48H108" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="48" r="4" fill="#19D9E8"/></g>
<g id="game-illustration"><g id="icon-dice" filter="url(#softGlow)"><g transform="rotate(-13 108 116)"><rect x="48" y="58" width="116" height="116" rx="22" fill="#13AEBE" stroke="#D8FFFF" stroke-width="4"/><g fill="#fff"><circle cx="78" cy="88" r="8"/><circle cx="134" cy="88" r="8"/><circle cx="106" cy="116" r="8"/><circle cx="78" cy="144" r="8"/><circle cx="134" cy="144" r="8"/></g></g><g transform="rotate(12 174 146)"><rect x="126" y="100" width="92" height="92" rx="19" fill="#287DDB" stroke="#D8E8FF" stroke-width="4"/><g fill="#fff"><circle cx="151" cy="125" r="7"/><circle cx="193" cy="125" r="7"/><circle cx="151" cy="167" r="7"/><circle cx="193" cy="167" r="7"/></g></g></g></g>
<g id="badge"><rect x="370" y="34" width="76" height="29" rx="9" fill="#19D9E8"/><text x="408" y="54" text-anchor="middle" font-size="14" font-weight="800" fill="#061226">HOT</text></g>
<g id="card-copy"><text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#F7FBFF">Over/Under Dice</text><text x="24" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#AFC4E1">Instant Rolls</text></g>
<g id="minimum-bet"><rect x="24" y="407" width="94" height="40" rx="20" fill="#0B1A32" stroke="#6C8BAA" stroke-width="1.5"/><text x="71" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#F3F8FF">Min ₹20</text></g><g id="play-button"><rect x="330" y="407" width="116" height="40" rx="20" fill="#19D9E8"/><text x="388" y="433" text-anchor="middle" font-size="16" font-weight="800" fill="#071426">Play Now →</text></g>
</svg>