<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<title>Andar Bahar — editable game card</title>
<defs>
 <linearGradient id="cardBg" x1="0" y1="0" x2="480" y2="480"><stop stop-color="#073B34"/><stop offset="1" stop-color="#080F24"/></linearGradient>
 <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48D8A8" stop-opacity=".23"/><stop offset="1" stop-color="#071329" stop-opacity=".05"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1A1"/><stop offset=".5" stop-color="#FFC83D"/><stop offset="1" stop-color="#E58B16"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="card-background"><rect x="4" y="4" width="472" height="472" rx="34" fill="url(#cardBg)" stroke="#48D8A8" stroke-width="2.5"/><rect x="5" y="5" width="470" height="470" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/><circle cx="420" cy="130" r="95" fill="#48D8A8" opacity=".07"/><circle cx="35" cy="330" r="70" fill="#48D8A8" opacity=".05"/></g>
<g id="art-panel"><rect x="20" y="20" width="440" height="230" rx="25" fill="url(#artBg)" stroke="#48D8A8" stroke-opacity=".55" stroke-width="1.5"/><path d="M36 48H108" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="48" r="4" fill="#48D8A8"/></g>
<g id="game-illustration"><g id="icon-cards" filter="url(#softGlow)"><g transform="rotate(-12 110 120)"><rect x="52" y="52" width="100" height="140" rx="12" fill="#F6F3E9" stroke="#E9C878" stroke-width="4"/><text x="67" y="91" font-size="27" font-weight="800" fill="#16345A">A</text><path d="M103 90 L126 119 L103 148 L80 119Z" fill="#153C63"/></g><g transform="rotate(12 171 120)"><rect x="130" y="52" width="100" height="140" rx="12" fill="#F6F3E9" stroke="#E9C878" stroke-width="4"/><text x="145" y="91" font-size="27" font-weight="800" fill="#E83D61">♥</text><path d="M180 90 L203 119 L180 148 L157 119Z" fill="#D83C5E"/></g></g></g>
<g id="badge"><rect x="370" y="34" width="76" height="29" rx="9" fill="#48D8A8"/><text x="408" y="54" text-anchor="middle" font-size="14" font-weight="800" fill="#061226">HOT</text></g>
<g id="card-copy"><text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#F7FBFF">Andar Bahar</text><text x="24" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#AFC4E1">Traditional Game</text></g>
<g id="minimum-bet"><rect x="24" y="407" width="94" height="40" rx="20" fill="#0B1A32" stroke="#6C8BAA" stroke-width="1.5"/><text x="71" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#F3F8FF">Min ₹25</text></g><g id="play-button"><rect x="330" y="407" width="116" height="40" rx="20" fill="#48D8A8"/><text x="388" y="433" text-anchor="middle" font-size="16" font-weight="800" fill="#071426">Play Now →</text></g>
</svg>