<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<title>More Games — editable game card</title>
<defs>
 <linearGradient id="cardBg" x1="0" y1="0" x2="480" y2="480"><stop stop-color="#0A2D55"/><stop offset="1" stop-color="#080F24"/></linearGradient>
 <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36BFFF" stop-opacity=".23"/><stop offset="1" stop-color="#071329" stop-opacity=".05"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1A1"/><stop offset=".5" stop-color="#FFC83D"/><stop offset="1" stop-color="#E58B16"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="card-background"><rect x="4" y="4" width="472" height="472" rx="34" fill="url(#cardBg)" stroke="#36BFFF" stroke-width="2.5"/><rect x="5" y="5" width="470" height="470" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/><circle cx="420" cy="130" r="95" fill="#36BFFF" opacity=".07"/><circle cx="35" cy="330" r="70" fill="#36BFFF" opacity=".05"/></g>
<g id="art-panel"><rect x="20" y="20" width="440" height="230" rx="25" fill="url(#artBg)" stroke="#36BFFF" stroke-opacity=".55" stroke-width="1.5"/><path d="M36 48H108" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="48" r="4" fill="#36BFFF"/></g>
<g id="game-illustration"><g id="icon-chest" filter="url(#softGlow)"><rect x="55" y="104" width="170" height="92" rx="14" fill="#087DE2" stroke="#C7F1FF" stroke-width="4"/><path d="M45 105 Q140 35 235 105Z" fill="#16B7FF" stroke="#C7F1FF" stroke-width="4"/><rect x="128" y="105" width="24" height="91" fill="#FFD15A"/><path d="M140 54 L158 77 L140 91 L122 77Z" fill="#fff" stroke="#9BEAFF" stroke-width="3"/></g></g>

<g id="card-copy"><text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#F7FBFF">More Games</text><text x="24" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#AFC4E1">Explore all games</text></g>
<g id="explore-button"><rect x="55" y="407" width="390" height="40" rx="20" fill="none" stroke="#36BFFF" stroke-width="2"/><text x="250" y="433" text-anchor="middle" font-size="16" font-weight="800" fill="#36BFFF">Explore All Games →</text></g>
</svg>