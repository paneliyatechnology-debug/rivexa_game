<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<title>Crash — editable game card</title>
<defs>
 <linearGradient id="cardBg" x1="0" y1="0" x2="480" y2="480"><stop stop-color="#4A0B36"/><stop offset="1" stop-color="#080F24"/></linearGradient>
 <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF3C9D" stop-opacity=".23"/><stop offset="1" stop-color="#071329" stop-opacity=".05"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1A1"/><stop offset=".5" stop-color="#FFC83D"/><stop offset="1" stop-color="#E58B16"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="card-background"><rect x="4" y="4" width="472" height="472" rx="34" fill="url(#cardBg)" stroke="#FF3C9D" stroke-width="2.5"/><rect x="5" y="5" width="470" height="470" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/><circle cx="420" cy="130" r="95" fill="#FF3C9D" opacity=".07"/><circle cx="35" cy="330" r="70" fill="#FF3C9D" opacity=".05"/></g>
<g id="art-panel"><rect x="20" y="20" width="440" height="230" rx="25" fill="url(#artBg)" stroke="#FF3C9D" stroke-opacity=".55" stroke-width="1.5"/><path d="M36 48H108" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="48" r="4" fill="#FF3C9D"/></g>
<g id="game-illustration"><g id="icon-rocket" filter="url(#softGlow)" transform="rotate(34 140 125)"><path d="M140 42 C182 72 190 122 171 160 L140 188 L109 160 C90 122 98 72 140 42Z" fill="#FF3C9D" stroke="#FFE4F2" stroke-width="3"/><circle cx="140" cy="105" r="17" fill="#10223F" stroke="#E9F7FF" stroke-width="4"/><path d="M109 143 L82 171 L117 166 M171 143 L198 171 L163 166" fill="#FFB44A" stroke="#FFE5A8" stroke-width="3"/><path d="M125 184 L140 220 L155 184" fill="#FF8C42"/><path d="M93 202L77 222 M187 202L203 222" stroke="#FF8C42" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="badge"><rect x="370" y="34" width="76" height="29" rx="9" fill="#FF3C9D"/><text x="408" y="54" text-anchor="middle" font-size="14" font-weight="800" fill="#061226">HOT</text></g>
<g id="card-copy"><text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#F7FBFF">Crash</text><text x="24" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#AFC4E1">Multiplier Game</text></g>
<g id="minimum-bet"><rect x="24" y="407" width="94" height="40" rx="20" fill="#0B1A32" stroke="#6C8BAA" stroke-width="1.5"/><text x="71" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#F3F8FF">Min ₹10</text></g><g id="play-button"><rect x="330" y="407" width="116" height="40" rx="20" fill="#FF3C9D"/><text x="388" y="433" text-anchor="middle" font-size="16" font-weight="800" fill="#071426">Play Now →</text></g>
</svg>